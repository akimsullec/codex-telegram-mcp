name: Windows tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check plugins/telegram-local
      - run: python -m compileall -q plugins/telegram-local
      - working-directory: plugins/telegram-local
        run: python -m coverage run --source=core -m unittest discover -p 'test_*.py' -v
      - working-directory: plugins/telegram-local
        run: python -m coverage report --fail-under=80
